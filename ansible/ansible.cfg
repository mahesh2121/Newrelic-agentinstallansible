# Ansible configuration for the New Relic agent automation.
# Run every command from inside this directory (or set ANSIBLE_CONFIG) so this
# file is picked up automatically.
#
# Verify it is in effect:  ansible --version | head -3   -> "config file = .../ansible/ansible.cfg"

[defaults]
inventory         = ./inventory/hosts.yml
roles_path        = ./roles
collections_path  = ./collections

# --- output -------------------------------------------------------------------
# NOTE: stdout_callback = yaml and callback_enabled = profile_tasks both require
# the community.general / ansible.posix collections. They are intentionally NOT
# set here so this repo runs on a bare ansible-core install (see Day 17).
# Uncomment them once you have installed ansible/requirements.yml.
# stdout_callback = yaml
# callback_enabled = profile_tasks, timer
display_skipped_hosts = False
display_ok_hosts  = True
show_custom_stats = True

# --- safety / behaviour -------------------------------------------------------
host_key_checking = True
retry_files_enabled = False
forks             = 20
timeout           = 30
gathering         = smart
fact_caching      = jsonfile
fact_caching_connection = ./.facts
fact_caching_timeout = 3600
interpreter_python = auto_silent
deprecation_warnings = True
command_warnings = False
localhost_warning = False

# Never let a typo silently become "run on everything".
[inventory]
unparsed_is_failed = True

[ssh_connection]
pipelining    = True
ssh_args      = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
control_path  = /tmp/ansible-%%h-%%r
scp_if_ssh    = smart

[privilege_escalation]
become       = True
become_method = sudo
become_user  = root
become_ask_pass = False
