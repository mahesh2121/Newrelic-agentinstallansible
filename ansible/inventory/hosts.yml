# Source-of-truth inventory (replaces the old top-level `inverntory.ini`).
#
# Three ways to keep this file in sync with reality, cheapest first:
#   1. Static file (this one)          - fine for < 20 long-lived hosts
#   2. Generated by Terraform output   - terraform/scripts/tf_to_inventory.py
#   3. Read live from terraform state  - inventory/terraform.py (dynamic plugin)
#
# Verify:  ansible-inventory --graph
#          ansible-inventory --list --yaml
---
all:
  children:

    # ---------------------------------------------------------------- control plane
    # Terraform builds these; Ansible only configures them.
    servers:
      hosts:
        # Legacy host that used to live in inverntory.ini. Kept so that
        # `ansible servers -m ping` still works during the migration.
        legacy-13-233-199-9:
          ansible_host: 13.233.199.9

    # ------------------------------------------------------------- local lab (no cloud)
    # `ansible-lint` and every lab in docs/ run against this group so the whole
    # course is practicable without an AWS account.
    lab:
      hosts:
        lab-local:
          ansible_connection: local
          ansible_host: localhost
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # ------------------------------------------------------------- functional groups
    newrelic_infra:
      children:
        servers:
        lab:

    newrelic_apm:
      children:
        servers:

    hardening:
      children:
        servers:
